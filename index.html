<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d13"><title>Ashen Siege · 잿빛 공성</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="combat.css"></head>
<body><main>
<header><div><small>ASHEN SIEGE / ACT I</small><h1>잿빛 공성</h1><p>세 번의 습격을 버티고 안뜰의 주인이 되세요.</p></div><div class="controls"><kbd>WASD</kbd><span>이동</span><i></i><kbd>CLICK</kbd><span>공격</span></div></header>
<section class="arena" aria-label="기사 공성 전투 게임">
 <div class="hud"><div class="crest">♜</div><div class="vitals"><div class="statline"><strong>IRON VANGUARD</strong><span>LV <b id="level">1</b></span></div><div class="bar health"><i id="healthbar"></i><em id="health">100 / 100</em></div></div><div class="counter"><small>WAVE</small><strong id="wave">1</strong></div><div class="counter"><small>DEFEATED</small><strong id="score">0 / 10</strong></div><div class="gold"><span>◆</span><b id="gold">0</b></div><button id="pause" aria-label="일시정지">Ⅱ</button></div>
 <canvas id="game" width="960" height="540" tabindex="0" aria-label="WASD로 이동하고 마우스로 조준해 클릭 공격하는 전투 게임"></canvas>
 <div class="xp"><span>EXPERIENCE</span><div><i id="xpbar"></i></div><section class="skills" aria-label="스킬 슬롯"><b><em>1</em>⚔</b><b><em>2</em>✦</b><b class="locked"><em>3</em>◆</b><b class="locked"><em>4</em>✹</b></section></div>
 <div id="overlay"><small>THE COURTYARD DEMANDS BLOOD</small><h2 id="title">잿빛 공성 시험</h2><p id="message">에셋을 불러오고 있어요…</p><button id="start" disabled>준비 중</button></div>
</section>
<div class="touch"><div class="pad"><button data-key="w" aria-label="위로 이동">W</button><button data-key="a" aria-label="왼쪽 이동">A</button><button data-key="s" aria-label="아래로 이동">S</button><button data-key="d" aria-label="오른쪽 이동">D</button></div><button class="attack" data-action="attack" aria-label="검 공격">⚔<span>공격</span></button></div>
