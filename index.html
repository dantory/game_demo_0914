<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111722"><title>Ashen Courtyard · 잿빛 안뜰</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><div><small>ASHEN COURTYARD / 01</small><h1>잿빛 안뜰</h1><p>작은 기사, 오래된 성벽, 다섯 마리의 불청객.</p></div><span class="badge">PLAYABLE DEMO</span></header>
<section class="arena" aria-label="기사 전투 게임"><div class="hud"><div><small>KNIGHT</small><div id="health" aria-label="체력">♥ ♥ ♥ ♥ ♥</div></div><div class="objective"><small>안뜰을 되찾으세요</small><strong id="score">0 / 5</strong></div><button id="pause" aria-label="일시정지">Ⅱ</button></div>
<canvas id="game" width="960" height="540" tabindex="0" aria-label="WASD 또는 방향키로 이동하고 Space로 공격하는 전투 게임"></canvas>
<div id="overlay"><small>THE COURTYARD AWAITS</small><h2 id="title">안뜰의 마지막 기사</h2><p id="message">에셋을 불러오고 있어요…</p><button id="start" disabled>준비 중</button></div>
<div class="status"><span id="status">돌담 사이에서 슬라임을 찾아보세요.</span><span>WASD / 방향키 · SPACE 공격</span></div></section>
<div class="touch"><div class="pad"><button data-key="w" aria-label="위로 이동">↑</button><button data-key="a" aria-label="왼쪽 이동">←</button><button data-key="s" aria-label="아래로 이동">↓</button><button data-key="d" aria-label="오른쪽 이동">→</button></div><button class="attack" data-key=" " aria-label="검 공격">⚔<span>공격</span></button></div>
<footer><span>01 — 폐허 안뜰</span><p>캐릭터: SpriteShip AI · 정면 걷기/공격 시연<br>맵·슬라임·UI: 코드 제작 · 추가 생성 비용 없음</p><a href="https://github.com/dantory/game_demo_0914" target="_blank" rel="noreferrer">소스 보기 ↗</a></footer></main><script type="module" src="src/app.js"></script></body></html>
